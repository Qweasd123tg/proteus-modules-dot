[package]
name = "proteus-example-usage-attribution"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace]

[dependencies]
proteus-contracts = { git = "https://github.com/Proteus-harness/Proteus-core.git", rev = "3f36a003b4f3fde2242fc80f7aedac00dd127d1d" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "usage-attribution-stdin"
path = "src/main.rs"

[profile.dev]
debug = "line-tables-only"
