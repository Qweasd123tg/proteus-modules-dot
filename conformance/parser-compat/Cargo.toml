[package]
name = "proteus-typed-frontmatter-comparison"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace]

[dependencies]
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_yaml = "=0.9.34"
ring = "=0.17.14"
yaml_serde = "=0.10.7"
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize", "comments"] }

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
