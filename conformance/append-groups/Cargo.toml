[package]
name = "proteus-append-group-probe"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Fixed-history append-group controls at pinned public Core boundaries"

[workspace]

[dependencies]
anyhow = "1"
proteus-core = { git = "https://github.com/Proteus-harness/Proteus-core.git", rev = "1fc3ef223d10322815dd9290a50d045bc95402bb" }
proteus-contracts = { git = "https://github.com/Proteus-harness/Proteus-core.git", rev = "1fc3ef223d10322815dd9290a50d045bc95402bb" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }

[profile.dev]
debug = "line-tables-only"
[profile.test]
debug = "line-tables-only"
