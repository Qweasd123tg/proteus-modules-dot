[package]
name = "proteus-mcp-sdk-probes"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace]

[dependencies]
rmcp = { version = "=3.3.0", default-features = false, features = ["client", "transport-async-rw"] }
serde_json = "=1.0.154"
tokio = { version = "=1.52.2", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[[bin]]
name = "authored-mcp-fixture"
path = "src/bin/authored-mcp-fixture.rs"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
