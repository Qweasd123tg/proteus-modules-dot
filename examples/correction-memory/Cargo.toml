[package]
name = "proteus-example-correction-memory"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
autoexamples = false

[[example]]
name = "correction_workflow"
path = "examples/correction_workflow.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
proteus-module-sdk = { git = "https://github.com/Proteus-harness/Proteus-core.git", rev = "3f36a003b4f3fde2242fc80f7aedac00dd127d1d" }
ring = "=0.17.14"
rusqlite = { version = "=0.33.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
proteus-example-evidence-spans = { path = "../evidence-spans" }

