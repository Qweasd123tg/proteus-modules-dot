[package]
name = "proteus-example-portable-skill-catalog"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace]

[dependencies]
anyhow = "1"
proteus-module-sdk = { git = "https://github.com/Proteus-harness/Proteus-core.git", rev = "3f36a003b4f3fde2242fc80f7aedac00dd127d1d" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "=0.9.34"
ring = "=0.17.14"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
