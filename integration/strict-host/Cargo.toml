[package]
name = "proteus-strict-agent-host"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
[workspace]
[dependencies]
anyhow = "1"
async-trait = "0.1"
proteus-core = { git = "https://github.com/Proteus-harness/Proteus-core.git", rev = "3f36a003b4f3fde2242fc80f7aedac00dd127d1d" }
proteus-module-sdk = { git = "https://github.com/Proteus-harness/Proteus-core.git", rev = "3f36a003b4f3fde2242fc80f7aedac00dd127d1d" }
proteus-strict-host-fixture = { path = "../strict-host-fixture" }
proteus-example-json-receipt = { path = "../../experiments/strict-pair/receipt-contract" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
[profile.dev]
debug = "line-tables-only"
[profile.test]
debug = "line-tables-only"
