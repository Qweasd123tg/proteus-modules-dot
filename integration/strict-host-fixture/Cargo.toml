[package]
name = "proteus-strict-host-fixture"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Authored offline model and exact-args policy for strict JSON host integration"

[workspace]

[dependencies]
anyhow = "1"
proteus-module-sdk = { git = "https://github.com/Proteus-harness/Proteus-core.git", rev = "3f36a003b4f3fde2242fc80f7aedac00dd127d1d" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = "line-tables-only"
[profile.test]
debug = "line-tables-only"
