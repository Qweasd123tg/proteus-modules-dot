[package]
name = "proteus-examples-host-smoke"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Offline integration smoke for three examples against the pinned real Proteus Core"
[workspace]
[dependencies]
anyhow = "1"
proteus-core = { git = "https://github.com/Proteus-harness/Proteus-core.git", rev = "3f36a003b4f3fde2242fc80f7aedac00dd127d1d" }
proteus-module-sdk = { git = "https://github.com/Proteus-harness/Proteus-core.git", rev = "3f36a003b4f3fde2242fc80f7aedac00dd127d1d" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
[profile.dev]
debug = "line-tables-only"
[profile.test]
debug = "line-tables-only"
