[package]
name = "desktop-state-history-probe"
version = "0.0.0"
edition = "2024"
[workspace]
[dependencies]
proteus-contracts = { path = "/workspace/shared/state-core-trace/crates/proteus-contracts" }
serde_json = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
zip = {version="2",default-features=false,features=["deflate"]}
