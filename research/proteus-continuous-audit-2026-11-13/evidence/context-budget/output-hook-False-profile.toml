active_provider = "local"
[providers.local]
provider = "anthropic"
model = "fixture-model"
stream = false
[modules]
workflow = "coding.codex_loop"
context = "codex_context"
policy = "fixture_allow_all"
hooks = []
[components.policy]
command = "python3"
args = ["-B", "/workspace/shared/proteus-review-20261112/core/crates/proteus-core/tests/fixtures/process_allow_all_policy.py"]
[components.policy.exports.policy.fixture_allow_all]
[components.workflow]
command = "/workspace/shared/disabled-skill-context-target/debug/proteus-coding-workflow-module"
[components.workflow.exports.workflow."coding.codex_loop"]
[components.context]
command = "/workspace/shared/disabled-skill-context-target/debug/proteus-context-pack-module"
[components.context.exports.context.codex_context]
[module_config.context.codex_context]
providers = ["environment"]
[components.fixture-tool]
command = "python3"
args = ["-B", "/workspace/shared/context-budget-chain-evidence/tool_fixture.py"]
[components.fixture-tool.exports.tool.content_probe]
[components.native-model]
command = "/workspace/shared/proteus-review-20261112/core/target/sources/modules/target/debug/proteus-model-pack-module"
[components.native-model.exports.model.anthropic]
[module_config.model.anthropic]
implementation = "anthropic"
api_key = "synthetic-not-a-credential"
base_url = "http://127.0.0.1:40241"
[components.output-budget]
command = "/workspace/shared/proteus-review-20261112/core/target/sources/modules/target/debug/proteus-hook-pack-module"
[components.output-budget.exports.hook."hook.output_budget"]
[module_config.hook."hook.output_budget"]
max_bytes = 16000
head_bytes = 12000
[tools]
enabled = ["content_probe"]
[agent_control]
surface = "none"
max_depth = 0
