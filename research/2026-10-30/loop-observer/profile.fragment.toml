# TEMPLATE ONLY: append the id to your existing modules.hooks array.
# Do not replace existing hooks with this single-item illustration.
# Put this observer AFTER tool-output transformations and request compaction.
[modules]
hooks = ["loop_observer.repeated_result"]

[components.loop-observer]
command = "/ABSOLUTE/PATH/TO/target/release/proteus-example-loop-observer"

[components.loop-observer.exports.hook."loop_observer.repeated_result"]
timeout_ms = 1000

[module_config.hook."loop_observer.repeated_result"]
# Replace with actual selected tools. Names are exact and not automatically
# discovered. Do not list CI/status/wait tools unless you want their advisories.
observed_tools = ["read_file", "rg_search"]
threshold = 3
max_scopes = 32
max_observation_bytes = 32768
idle_ttl_seconds = 900
