[package]
name = "proteus-example-loop-observer"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

# A real standalone executable, not a Core/Modules workspace member.
[workspace]

[dependencies]
anyhow = "=1.0.102"
proteus-module-sdk = { git = "https://github.com/Proteus-harness/Proteus-core.git", rev = "925de0fc5ee5995409b11e42b216a15ca12f76d0" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
proteus-process-host = { git = "https://github.com/Proteus-harness/Proteus-core.git", rev = "925de0fc5ee5995409b11e42b216a15ca12f76d0" }
tokio = { version = "=1.52.2", features = ["rt"] }

[profile.dev]
debug = "line-tables-only"
