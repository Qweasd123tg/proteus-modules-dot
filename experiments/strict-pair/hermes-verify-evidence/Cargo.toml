[package]
name = "proteus-example-hermes-verify-evidence"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
autobins = false

[[bin]]
name = "proteus-example-hermes-verify-evidence-strict"
path = "src/main.rs"

[dependencies]
proteus-example-json-receipt = { path = "../receipt-contract" }
anyhow = "1"
proteus-module-sdk = { git = "https://github.com/Proteus-harness/Proteus-core.git", rev = "3f36a003b4f3fde2242fc80f7aedac00dd127d1d" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"


[dev-dependencies]
proteus-example-json-contracts = { path = "../json-contracts" }
