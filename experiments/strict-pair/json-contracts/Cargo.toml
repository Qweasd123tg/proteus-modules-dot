[package]
name = "proteus-example-json-contracts"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
autobins = false
autoexamples = false

[[bin]]
name = "proteus-example-json-contracts-strict"
path = "src/main.rs"

[[example]]
name = "strict_authored_fixture"
path = "examples/authored_fixture.rs"

[[example]]
name = "strict_json_policy"
path = "examples/strict_policy.rs"

[dependencies]
proteus-example-json-receipt = { path = "../receipt-contract" }
anyhow = "1"
proteus-module-sdk = { git = "https://github.com/Proteus-harness/Proteus-core.git", rev = "3f36a003b4f3fde2242fc80f7aedac00dd127d1d" }
ring = "=0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

