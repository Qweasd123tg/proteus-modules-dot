[workspace]
members = ["crates/diff"]
resolver = "2"

[package]
name = "desktop-svg-source-probe"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "=1.0.104"
proteus-diff = { path = "crates/diff" }
roxmltree = "=0.21.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"

[profile.dev]
debug = 0
opt-level = 0
incremental = false
