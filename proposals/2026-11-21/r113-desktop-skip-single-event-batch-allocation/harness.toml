[package]
name = "desktop-codex-ui-batch-probe"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
async-channel = "2"
proteus-codex-client = { path = "crates/codex-client" }
serde_json = { version = "1", features = ["float_roundtrip"] }

[features]
ordered = ["serde_json/preserve_order"]

[profile.dev]
debug = 0
opt-level = 0
incremental = false

[workspace]
resolver = "3"
