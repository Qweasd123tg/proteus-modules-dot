[package]
name = "desktop-singleton-text-outcome-probe"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
proteus-contracts = { git = "https://github.com/Proteus-harness/Proteus-core.git", rev = "7cbc7206f03fac130d05bed2844de275476fedc8" }
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = 0
opt-level = 0
incremental = false

[profile.dev.package.desktop-singleton-text-outcome-probe]
opt-level = 2
