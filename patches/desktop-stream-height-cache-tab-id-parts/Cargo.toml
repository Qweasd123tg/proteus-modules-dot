[workspace]
members = ["crates/tabs"]
resolver = "2"
[package]
name = "desktop-height-key-proof"
version = "0.0.0"
edition = "2024"
publish = false
[dependencies]
proteus-tabs = { path = "crates/tabs" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
sha2 = "=0.10.9"
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
[profile.dev]
debug = 0
