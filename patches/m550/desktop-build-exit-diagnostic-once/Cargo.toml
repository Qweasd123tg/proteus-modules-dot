[package]
name = "backend-diagnostic-m411-proof"
version = "0.0.0"
edition = "2024"

[dependencies]
anyhow = "=1.0.104"
libc = "=0.2.190"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "=1.0.152"
uuid = { version = "=1.28.0", features = ["v4"] }
url = "=2.5.8"

[features]
preserve_order = ["serde_json/preserve_order"]

[profile.release]
incremental = false
debug = false
opt-level = "s"
