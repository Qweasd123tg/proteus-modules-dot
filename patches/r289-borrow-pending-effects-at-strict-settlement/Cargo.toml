[package]
name = "r289-pending-effects-proof"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]
resolver = "2"
exclude = ["worker/native/crates/proteus-contracts", "worker/native/crates/proteus-session-semantics"]

[features]
preserve_order = ["serde_json/preserve_order"]
meter = []

[dependencies]
proteus-contracts = { path = "worker/native/crates/proteus-contracts" }
proteus-session-semantics = { path = "worker/native/crates/proteus-session-semantics" }
anyhow = "=1.0.102"
im = { version = "=15.1.0", default-features = false }
async-trait = "=0.1.89"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
ring = "=0.17.14"
uuid = { version = "=1.23.1", features = ["serde", "v4"] }
tempfile = { version = "=3.27.0", default-features = false }
base64 = "=0.22.1"
miniz_oxide = "=0.8.9"

[[bin]]
name = "route"
path = "worker/native/main.rs"
