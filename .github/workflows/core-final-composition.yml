name: Final pure foundation composition

on:
  push:
    branches: [ci/core-final-composition-20261027]
    paths:
      - 'foundation/2026-10-27/core-final-composition/**'
      - '.github/workflows/core-final-composition.yml'

permissions:
  contents: read

concurrency:
  group: core-final-composition-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  RUST_TEST_THREADS: '4'
  RUSTUP_TOOLCHAIN: '1.95.0'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONOPTIMIZE: '0'
  GIT_TERMINAL_PROMPT: '0'
  npm_config_audit: 'false'
  npm_config_fund: 'false'

jobs:
  qualify:
    if: github.repository == 'Qweasd123tg/proteus-modules-dot' && github.ref == 'refs/heads/ci/core-final-composition-20261027'
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Admit only a standard runner with the initial disk reserve
        run: python3 -c 'import os, shutil; assert shutil.disk_usage(os.environ["RUNNER_TEMP"]).free >= 8 * 1024 ** 3, "hosted disk admission below 8 GiB"'
      - name: Install Linux compile dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config clang lld libssl-dev ripgrep meson ninja-build libcap-dev libcap2-bin libselinux1-dev curl xz-utils
      - name: Build and install the verified unprivileged sandbox dependency
        timeout-minutes: 10
        run: |
          test "$(id -u)" -ne 0
          build_root="$RUNNER_TEMP/core-current-bubblewrap-0.13.1"
          mkdir "$build_root"
          cd "$build_root"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 120 --max-filesize 129472 \
            --output bubblewrap-0.13.1.tar.xz \
            https://github.com/containers/bubblewrap/releases/download/v0.13.1/bubblewrap-0.13.1.tar.xz
          test "$(stat -c '%s' bubblewrap-0.13.1.tar.xz)" -eq 129472
          echo '0e85c8702248b8dd64144f594147553650cdd0e4c951690345faace79c217c4d  bubblewrap-0.13.1.tar.xz' | sha256sum --check
          tar --extract --xz --file bubblewrap-0.13.1.tar.xz
          cd bubblewrap-0.13.1
          meson setup out --buildtype=release --wrap-mode=nodownload \
            -Dman=disabled -Dbash_completion=disabled -Dzsh_completion=disabled \
            -Dselinux=enabled -Dtests=false
          meson compile -C out -j2
          # Only this ordinary dependency binary is installed in the ephemeral
          # VM. No setuid, file capabilities, or security-policy changes.
          sudo install -o root -g root -m0755 out/bwrap /usr/bin/bwrap
          cmp --silent out/bwrap /usr/bin/bwrap
          test ! -L /usr/bin/bwrap
          test "$(stat -c '%a:%u:%g' /usr/bin/bwrap)" = '755:0:0'
          test -z "$(getcap /usr/bin/bwrap)"
          test "$(/usr/bin/bwrap --version)" = 'bubblewrap 0.13.1'
      - name: Require real default-policy namespace and FD capabilities
        timeout-minutes: 2
        run: |
          test "$(id -u)" -ne 0
          help_text=$(/usr/bin/bwrap --help)
          for flag in --disable-userns --bind-fd --ro-bind-fd --argv0; do
            grep -Fq -- "$flag" <<<"$help_text"
          done
          probe_root="$RUNNER_TEMP/core-current-bwrap-probe"
          mkdir "$probe_root"
          exec 3</usr
          exec 4<"$probe_root"
          /usr/bin/bwrap --unshare-all --unshare-user --disable-userns \
            --cap-drop ALL --die-with-parent --new-session --clearenv \
            --ro-bind / / --ro-bind-fd 3 /usr --bind-fd 4 /tmp \
            --proc /proc --dev /dev --remount-ro / \
            --argv0 core-current-namespace-probe -- /usr/bin/true
          {
            echo 'source_release=v0.13.1'
            echo 'source_sha256=0e85c8702248b8dd64144f594147553650cdd0e4c951690345faace79c217c4d'
            echo 'vendor_selftests=NOT_RUN; canonical_Core_sandbox_tests=REQUIRED'
            echo 'security_policy_changes=NONE'
            /usr/bin/bwrap --version
            sha256sum /usr/bin/bwrap
            stat -c 'mode_uid_gid=%a:%u:%g' /usr/bin/bwrap
            echo 'file_capabilities=NONE'
            uname -a
            cat /etc/os-release
            echo 'unprivileged_namespace_and_fd_probe=PASS'
          } > "$RUNNER_TEMP/core-current-bwrap-evidence.txt"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
      - name: Install exact official Rust
        timeout-minutes: 10
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustc +1.95.0 --version --verbose
      - name: Fetch immutable helper and recipe without execution
        timeout-minutes: 3
        run: |
          mkdir "$RUNNER_TEMP/core-final-composition-support"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 120 --max-filesize 109703 \
            --output "$RUNNER_TEMP/core-final-composition-support/check.py" \
            https://raw.githubusercontent.com/Qweasd123tg/proteus-modules-dot/72aeaa37b1f81baf105a0ec09f337237dc0b2a7f/foundation/2026-10-27/core-composition/check.py
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 120 --max-filesize 23264 \
            --output "$RUNNER_TEMP/core-final-composition-support/manifest.json" \
            https://raw.githubusercontent.com/Qweasd123tg/proteus-modules-dot/72aeaa37b1f81baf105a0ec09f337237dc0b2a7f/foundation/2026-10-27/core-composition/manifest.json
      - name: Verify all immutable executable inputs
        run: |
          echo '4b520e078a2349ec725aa45786df3042c9b3fdd02adbba7e58263b1b17cd9bc8  foundation/2026-10-27/core-final-composition/manifest.json' | sha256sum --check
          echo '3a92b2e5b8f444aed3421ba0c2cfa3acabe0b919d329d051debf5f4a55e192b5  foundation/2026-10-27/core-final-composition/check.py' | sha256sum --check
          echo '84e01c0e60b8936054cd1f6e91b7a1bc2bc500b7583160953e1976e9e1e75622  foundation/2026-10-27/core-compact-validation/manifest.json' | sha256sum --check
          echo '33c8ec75122e71db5d034410144bac273a4606dbda59ac8e63a205905bcc2c8d  foundation/2026-10-27/core-compact-validation/check.py' | sha256sum --check
          echo 'dca653f3eda6ece4e9f339f531669a14e249e7a0cf151dd77a58b9fea5eef603  foundation/2026-10-27/core-current-graph/manifest.json' | sha256sum --check
          echo '4cf85d5124f7d39cb38a3444287bf43254d74f1053a70fee926c6515ca3c6b3b  foundation/2026-10-27/core-current-graph/check.py' | sha256sum --check
          echo '2f917a4ca4dc71a3dfa8cf2dc376991a7ddf1580cd347aaff8cb6ccc50568147  '"$RUNNER_TEMP/core-final-composition-support/check.py" | sha256sum --check
          echo '0a6b5a4aba9112abe866fa5131d7f0f58a771f3542ec891af51f96d9bd7dae82  '"$RUNNER_TEMP/core-final-composition-support/manifest.json" | sha256sum --check
      - name: Exercise bounded controller and exact target-bound self-controls
        timeout-minutes: 2
        run: |
          set -o pipefail
          mkdir "$RUNNER_TEMP/core-final-composition-self-test"
          python3 -B foundation/2026-10-27/core-final-composition/check.py \
            --manifest foundation/2026-10-27/core-final-composition/manifest.json \
            --compact-controller foundation/2026-10-27/core-compact-validation/check.py \
            --compact-manifest foundation/2026-10-27/core-compact-validation/manifest.json \
            --qualified-controller foundation/2026-10-27/core-current-graph/check.py \
            --qualified-manifest foundation/2026-10-27/core-current-graph/manifest.json \
            --helper "$RUNNER_TEMP/core-final-composition-support/check.py" \
            --recipe "$RUNNER_TEMP/core-final-composition-support/manifest.json" --self-test 2>&1 | head -c 1048576 | tee "$RUNNER_TEMP/core-final-composition-self-test/output.log"
      - name: Compile and run the one exact pure canonical composition
        id: source
        run: |
          python3 -B foundation/2026-10-27/core-final-composition/check.py \
            --manifest foundation/2026-10-27/core-final-composition/manifest.json \
            --compact-controller foundation/2026-10-27/core-compact-validation/check.py \
            --compact-manifest foundation/2026-10-27/core-compact-validation/manifest.json \
            --qualified-controller foundation/2026-10-27/core-current-graph/check.py \
            --qualified-manifest foundation/2026-10-27/core-current-graph/manifest.json \
            --helper "$RUNNER_TEMP/core-final-composition-support/check.py" \
            --recipe "$RUNNER_TEMP/core-final-composition-support/manifest.json" --run \
            --work "$RUNNER_TEMP/core-final-composition-work" \
            --evidence "$RUNNER_TEMP/core-final-composition-evidence"
      - name: Independently reparse exact current-run canonical evidence
        if: always()
        timeout-minutes: 3
        env:
          FINAL_SOURCE_STEP_RESULT: ${{ steps.source.outcome }}
        run: |
          echo '4b520e078a2349ec725aa45786df3042c9b3fdd02adbba7e58263b1b17cd9bc8  foundation/2026-10-27/core-final-composition/manifest.json' | sha256sum --check
          echo '3a92b2e5b8f444aed3421ba0c2cfa3acabe0b919d329d051debf5f4a55e192b5  foundation/2026-10-27/core-final-composition/check.py' | sha256sum --check
          echo '84e01c0e60b8936054cd1f6e91b7a1bc2bc500b7583160953e1976e9e1e75622  foundation/2026-10-27/core-compact-validation/manifest.json' | sha256sum --check
          echo '33c8ec75122e71db5d034410144bac273a4606dbda59ac8e63a205905bcc2c8d  foundation/2026-10-27/core-compact-validation/check.py' | sha256sum --check
          echo 'dca653f3eda6ece4e9f339f531669a14e249e7a0cf151dd77a58b9fea5eef603  foundation/2026-10-27/core-current-graph/manifest.json' | sha256sum --check
          echo '4cf85d5124f7d39cb38a3444287bf43254d74f1053a70fee926c6515ca3c6b3b  foundation/2026-10-27/core-current-graph/check.py' | sha256sum --check
          echo '2f917a4ca4dc71a3dfa8cf2dc376991a7ddf1580cd347aaff8cb6ccc50568147  '"$RUNNER_TEMP/core-final-composition-support/check.py" | sha256sum --check
          echo '0a6b5a4aba9112abe866fa5131d7f0f58a771f3542ec891af51f96d9bd7dae82  '"$RUNNER_TEMP/core-final-composition-support/manifest.json" | sha256sum --check
          python3 -B foundation/2026-10-27/core-final-composition/check.py \
            --manifest foundation/2026-10-27/core-final-composition/manifest.json \
            --compact-controller foundation/2026-10-27/core-compact-validation/check.py \
            --compact-manifest foundation/2026-10-27/core-compact-validation/manifest.json \
            --qualified-controller foundation/2026-10-27/core-current-graph/check.py \
            --qualified-manifest foundation/2026-10-27/core-current-graph/manifest.json \
            --helper "$RUNNER_TEMP/core-final-composition-support/check.py" \
            --recipe "$RUNNER_TEMP/core-final-composition-support/manifest.json" --audit \
            --evidence "$RUNNER_TEMP/core-final-composition-evidence" \
            --audit-evidence "$RUNNER_TEMP/core-final-composition-audit"
      - name: Retain bounded canonical source evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-final-composition-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-source
          path: |
            ${{ runner.temp }}/core-final-composition-evidence/result.json
            ${{ runner.temp }}/core-final-composition-evidence/*.log
          retention-days: 7
          if-no-files-found: warn
      - name: Retain bounded audit receipt and raw binding logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-final-composition-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-audit
          path: |
            ${{ runner.temp }}/core-final-composition-audit/result.json
            ${{ runner.temp }}/core-final-composition-audit/*.log
          retention-days: 7
          if-no-files-found: warn
      - name: Retain bounded self-controls even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-final-composition-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-self-test
          path: |
            ${{ runner.temp }}/core-final-composition-self-test/output.log
            ${{ runner.temp }}/core-current-bwrap-evidence.txt
          retention-days: 7
          if-no-files-found: warn
