name: Foundation tool catalog cache

on:
  workflow_dispatch:
  push:
    branches: [ci/foundation-tool-catalog-20261026]
    paths:
      - foundation/2026-10-26/tool-catalog-cache/**
      - .github/workflows/foundation-tool-catalog-cache.yml

permissions:
  contents: read

concurrency:
  group: foundation-tool-catalog-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'Qweasd123tg/proteus-modules-dot' && github.ref == 'refs/heads/ci/foundation-tool-catalog-20261026'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        scope: [modules-pinned, current-host]
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      RUST_TEST_THREADS: "4"
      PYTHONDONTWRITEBYTECODE: "1"
      RUSTUP_TOOLCHAIN: "1.95.0"
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.15"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          package-manager-cache: false
      - name: Install upstream Linux test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config clang lld libssl-dev bubblewrap ripgrep
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --die-with-parent --ro-bind / / --proc /proc --dev /dev -- /usr/bin/true
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - name: Validate actual baseline and candidate
        env:
          CARGO_HOME: ${{ runner.temp }}/tool-catalog-cargo
        run: |
          python3 -B foundation/2026-10-26/tool-catalog-cache/validate.py \
            "${{ matrix.scope }}" \
            --work-dir "${{ runner.temp }}/tool-catalog-${{ matrix.scope }}-work" \
            --evidence-dir "${{ runner.temp }}/tool-catalog-${{ matrix.scope }}-evidence"
      - name: Upload bounded validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tool-catalog-${{ matrix.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tool-catalog-${{ matrix.scope }}-evidence/
          if-no-files-found: warn
          retention-days: 14
