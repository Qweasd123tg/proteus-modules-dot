# Additive orchestrator only: original package gates and frozen workflow pins are unchanged.
# Each job uses a separate GitHub-hosted runner. No combined runtime activation.
name: Integration candidate restricted package gates
on:
  push:
    branches: ['ci/integration-candidate-20261026']
permissions:
  contents: read
jobs:
  usage-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-usage-attribution
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: 2
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 1
      - name: Fresh invocation and initial 8 GiB headroom
        id: destination
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -I -c 'import shutil; assert shutil.disk_usage(".").free >= 8*1024**3, "need 8 GiB; no deletion"'
          test ! -e validation/usage-attribution
          parent=$(mktemp -d "$RUNNER_TEMP/proteus-usage-XXXXXXXX")
          printf 'root=%s\n' "$parent" >> "$GITHUB_OUTPUT"
      - name: Supervised controls, locked build and exact 37 named tests
        shell: bash
        run: |
          python3 -B -I consumers/usage-attribution/ci/envelope.py --profile usage-attribution \
            --cwd "$GITHUB_WORKSPACE" --target "$CARGO_TARGET_DIR" \
            --output '${{ steps.destination.outputs.root }}/retained' \
            --artifacts "$GITHUB_WORKSPACE/validation/usage-attribution" \
            --input consumers/usage-attribution/ci/envelope.py \
            --input consumers/usage-attribution/ci/stage.py \
            --input consumers/usage-attribution/ci/contract.py \
            --input consumers/usage-attribution/ci/live_controls.py \
            --input consumers/usage-attribution/ci/live_fixture.py \
            --input consumers/usage-attribution/ci/verify.py \
            --input consumers/usage-attribution/ci/test_verify.py \
            --input consumers/usage-attribution/ci/test_envelope.py \
            --input .github/workflows/check-usage-attribution.yml \
            --input .github/workflows/check-integration-candidate.yml \
            -- python3 -B -I consumers/usage-attribution/ci/stage.py
      - name: Retain bounded invocation evidence including failures
        if: always() && steps.destination.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: usage-attribution-${{ github.sha }}
          path: ${{ steps.destination.outputs.root }}/retained/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
  strict-fullturn:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: false
      - name: Fresh dedicated directories and 8 GiB admission
        id: destination
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -I -c 'import shutil; assert shutil.disk_usage(".").free >= 8*1024**3, "need 8 GiB; no deletion"'
          parent=$(mktemp -d "$RUNNER_TEMP/proteus-strict-fullturn-XXXXXXXX")
          printf 'root=%s\n' "$parent" >> "$GITHUB_OUTPUT"
      - name: Supervised strict build and runtime gate
        env:
          STRICT_RESULTS_DIR: ${{ steps.destination.outputs.root }}/child
          STRICT_TARGET_ROOT: ${{ steps.destination.outputs.root }}/targets
          STRICT_OFFICIAL_DIR: ${{ steps.destination.outputs.root }}/official
        shell: bash
        run: |
          python3 -B -I ci/strict-fullturn/envelope.py --profile strict-fullturn \
            --cwd "$GITHUB_WORKSPACE" --target "$STRICT_TARGET_ROOT" \
            --output '${{ steps.destination.outputs.root }}/retained' \
            --artifacts "$STRICT_RESULTS_DIR" \
            --input ci/strict-fullturn/envelope.py --input ci/strict-fullturn/test_envelope.py \
            --input ci/strict-fullturn/run.sh --input ci/strict-fullturn/verify_ci.py \
            --input ci/strict-fullturn/EXPECTED.json --input ci/strict-fullturn/PUBLICATION.json \
            --input .github/workflows/check-strict-fullturn.yml \
            --input .github/workflows/check-integration-candidate.yml \
            -- bash "$GITHUB_WORKSPACE/ci/strict-fullturn/run.sh"
      # No further runtime steps, even if descendant state is unknown. This job
      # is retired after snapshot/upload; a failed capture never resumes tests.
      - name: Retain bounded snapshot including native journal names
        if: always() && steps.destination.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strict-fullturn-${{ github.sha }}
          path: ${{ steps.destination.outputs.root }}/retained/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
  correction-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-correction-memory
      TMPDIR: ${{ github.workspace }}/tmp-correction-memory
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: 2
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 1
      - name: Fresh invocation and initial 8 GiB headroom
        id: destination
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -I -c 'import shutil; assert shutil.disk_usage(".").free >= 8*1024**3, "need 8 GiB; no deletion"'
          test ! -e validation/correction-memory
          test ! -e "$TMPDIR"
          mkdir "$TMPDIR"
          parent=$(mktemp -d "$RUNNER_TEMP/proteus-cas-XXXXXXXX")
          printf 'root=%s\n' "$parent" >> "$GITHUB_OUTPUT"
      - name: Supervised controls, locked build and exact 69 named tests
        shell: bash
        run: |
          python3 -B -I examples/correction-memory/ci/envelope.py --profile cas-runtime \
            --cwd "$GITHUB_WORKSPACE" --target "$CARGO_TARGET_DIR" \
            --output '${{ steps.destination.outputs.root }}/retained' \
            --artifacts "$GITHUB_WORKSPACE/validation/correction-memory" \
            --input examples/correction-memory/ci/envelope.py \
            --input examples/correction-memory/ci/runtime_stage.py \
            --input examples/correction-memory/ci/contract.py \
            --input examples/correction-memory/ci/gate_common.py \
            --input examples/correction-memory/ci/verify_example.py \
            --input examples/correction-memory/ci/live_controls.py \
            --input examples/correction-memory/ci/live_fixture.py \
            --input examples/correction-memory/ci/verify_runtime.py \
            --input examples/correction-memory/ci/test_runtime.py \
            --input examples/correction-memory/ci/test_envelope.py \
            --input .github/workflows/check-correction-memory.yml \
            --input .github/workflows/check-integration-candidate.yml \
            -- python3 -B -I examples/correction-memory/ci/runtime_stage.py
      - name: Retain bounded invocation evidence including failures
        if: always() && steps.destination.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: correction-memory-${{ github.sha }}
          path: ${{ steps.destination.outputs.root }}/retained/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
