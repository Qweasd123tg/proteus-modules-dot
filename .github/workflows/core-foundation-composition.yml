name: Core foundation composition qualification

# Isolated experimental lane only; upstream manual workflows are untouched.
on:
  push:
    branches: [ci/core-foundation-composition-20261027]
    paths:
      - 'foundation/2026-10-27/core-composition/manifest.json'
      - 'foundation/2026-10-27/core-composition/check.py'
      - 'foundation/2026-10-27/core-composition/README.md'
      - 'foundation/2026-10-27/core-composition/recovery-owned-delete-control.patch'
      - '.github/workflows/core-foundation-composition.yml'

permissions:
  contents: read

concurrency:
  group: core-foundation-composition-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  RUST_TEST_THREADS: '4'
  RUSTUP_TOOLCHAIN: '1.95.0'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONOPTIMIZE: '0'
  GIT_TERMINAL_PROMPT: '0'
  npm_config_audit: 'false'
  npm_config_fund: 'false'

jobs:
  qualify:
    if: github.repository == 'Qweasd123tg/proteus-modules-dot' && github.ref == 'refs/heads/ci/core-foundation-composition-20261027'
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        phase: [baseline, production]
    steps: &qualification_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Linux compile dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config clang lld libssl-dev ripgrep meson ninja-build libcap-dev libcap2-bin libselinux1-dev curl xz-utils
      - name: Build and install the verified unprivileged sandbox dependency
        timeout-minutes: 10
        run: |
          test "$(id -u)" -ne 0
          build_root="$RUNNER_TEMP/core-composition-bubblewrap-0.13.1"
          mkdir "$build_root"
          cd "$build_root"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 120 --max-filesize 129472 \
            --output bubblewrap-0.13.1.tar.xz \
            https://github.com/containers/bubblewrap/releases/download/v0.13.1/bubblewrap-0.13.1.tar.xz
          test "$(stat -c '%s' bubblewrap-0.13.1.tar.xz)" -eq 129472
          echo '0e85c8702248b8dd64144f594147553650cdd0e4c951690345faace79c217c4d  bubblewrap-0.13.1.tar.xz' | sha256sum --check
          tar --extract --xz --file bubblewrap-0.13.1.tar.xz
          cd bubblewrap-0.13.1
          meson setup out --buildtype=release --wrap-mode=nodownload \
            -Dman=disabled -Dbash_completion=disabled -Dzsh_completion=disabled \
            -Dselinux=enabled -Dtests=false
          meson compile -C out -j2
          # Only this ordinary dependency binary is installed in the ephemeral
          # VM. No setuid, file capabilities, or security-policy changes.
          sudo install -o root -g root -m0755 out/bwrap /usr/bin/bwrap
          cmp --silent out/bwrap /usr/bin/bwrap
          test ! -L /usr/bin/bwrap
          test "$(stat -c '%a:%u:%g' /usr/bin/bwrap)" = '755:0:0'
          test -z "$(getcap /usr/bin/bwrap)"
          test "$(/usr/bin/bwrap --version)" = 'bubblewrap 0.13.1'
      - name: Require real default-policy namespace and FD capabilities
        timeout-minutes: 2
        run: |
          test "$(id -u)" -ne 0
          help_text=$(/usr/bin/bwrap --help)
          for flag in --disable-userns --bind-fd --ro-bind-fd --argv0; do
            grep -Fq -- "$flag" <<<"$help_text"
          done
          probe_root="$RUNNER_TEMP/core-composition-bwrap-probe"
          mkdir "$probe_root"
          exec 3</usr
          exec 4<"$probe_root"
          /usr/bin/bwrap --unshare-all --unshare-user --disable-userns \
            --cap-drop ALL --die-with-parent --new-session --clearenv \
            --ro-bind / / --ro-bind-fd 3 /usr --bind-fd 4 /tmp \
            --proc /proc --dev /dev --remount-ro / \
            --argv0 core-composition-namespace-probe -- /usr/bin/true
          {
            echo 'source_release=v0.13.1'
            echo 'source_sha256=0e85c8702248b8dd64144f594147553650cdd0e4c951690345faace79c217c4d'
            echo 'vendor_selftests=NOT_RUN; canonical_Core_sandbox_tests=REQUIRED'
            echo 'security_policy_changes=NONE'
            /usr/bin/bwrap --version
            sha256sum /usr/bin/bwrap
            stat -c 'mode_uid_gid=%a:%u:%g' /usr/bin/bwrap
            echo 'file_capabilities=NONE'
            uname -a
            cat /etc/os-release
            echo 'unprivileged_namespace_and_fd_probe=PASS'
          } > "$RUNNER_TEMP/core-composition-bwrap-evidence.txt"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
      - name: Install exact official Rust
        timeout-minutes: 10
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustc +1.95.0 --version --verbose
          node --version
          npm --version
      - name: Verify authored package identities
        run: |
          echo '0a6b5a4aba9112abe866fa5131d7f0f58a771f3542ec891af51f96d9bd7dae82  foundation/2026-10-27/core-composition/manifest.json' | sha256sum --check
          echo '2f917a4ca4dc71a3dfa8cf2dc376991a7ddf1580cd347aaff8cb6ccc50568147  foundation/2026-10-27/core-composition/check.py' | sha256sum --check
      - name: Check controller rejection and process limits
        timeout-minutes: 2
        run: python3 foundation/2026-10-27/core-composition/check.py --self-test
      - name: Qualify the exact isolated phase
        run: |
          python3 foundation/2026-10-27/core-composition/check.py \
            --phase "${{ matrix.phase }}" \
            --manifest foundation/2026-10-27/core-composition/manifest.json \
            --work "$RUNNER_TEMP/core-composition-work" \
            --evidence "$RUNNER_TEMP/core-composition-evidence"
      - name: Retain bounded qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-foundation-composition-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.phase }}
          path: |
            ${{ runner.temp }}/core-composition-evidence/result.json
            ${{ runner.temp }}/core-composition-evidence/*.log
            ${{ runner.temp }}/core-composition-bwrap-evidence.txt
          if-no-files-found: warn
          retention-days: 7

  instrumented:
    needs: qualify
    if: github.repository == 'Qweasd123tg/proteus-modules-dot' && github.ref == 'refs/heads/ci/core-foundation-composition-20261027'
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        phase: [instrumented]
    # A fresh standard VM, only after baseline AND strict production succeeded.
    # YAML aliases are supported by GitHub Actions; no merge keys are used.
    steps: *qualification_steps

  aggregate:
    needs: [qualify, instrumented]
    if: always() && github.repository == 'Qweasd123tg/proteus-modules-dot' && github.ref == 'refs/heads/ci/core-foundation-composition-20261027'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      QUALIFICATION_MATRIX_RESULT: ${{ needs.qualify.result }}
      INSTRUMENTED_JOB_RESULT: ${{ needs.instrumented.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download the exact baseline phase
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: core-foundation-composition-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-baseline
          path: ${{ runner.temp }}/core-composition-phases/baseline
      - name: Download the exact production phase
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: core-foundation-composition-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-production
          path: ${{ runner.temp }}/core-composition-phases/production
      - name: Download the exact instrumented phase
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: core-foundation-composition-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-instrumented
          path: ${{ runner.temp }}/core-composition-phases/instrumented
      - name: Require all three exact current-run phase receipts and raw outputs
        run: |
          python3 foundation/2026-10-27/core-composition/check.py \
            --manifest foundation/2026-10-27/core-composition/manifest.json \
            --aggregate "$RUNNER_TEMP/core-composition-phases" \
            --evidence "$RUNNER_TEMP/core-composition-aggregate"
      - name: Retain the bounded aggregate receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-foundation-composition-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-aggregate
          path: ${{ runner.temp }}/core-composition-aggregate/result.json
          if-no-files-found: warn
          retention-days: 7
