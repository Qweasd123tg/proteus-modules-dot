name: Experimental CAS dependency lock resolution only
on:
  push:
    branches: ['ci/correction-memory-cas-20261026']
    paths: ['examples/correction-memory/**', '.github/workflows/check-cas-lock-resolution.yml']
  pull_request:
    paths: ['examples/correction-memory/**', '.github/workflows/check-cas-lock-resolution.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cas-lock-resolution:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-cas-lock-resolution
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: 2
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 1
      - name: Fresh invocation and initial 8 GiB headroom
        id: destination
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -I -c 'import shutil; assert shutil.disk_usage(".").free >= 8*1024**3, "need 8 GiB; no deletion"'
          test ! -e validation/cas-lock-resolution
          parent=$(mktemp -d "$RUNNER_TEMP/proteus-usage-XXXXXXXX")
          printf 'root=%s\n' "$parent" >> "$GITHUB_OUTPUT"
      - name: Resolve lock only; do not compile or run Rust
        shell: bash
        run: |
          python3 -B -I examples/correction-memory/ci/envelope.py --profile cas-lock-resolution \
            --cwd "$GITHUB_WORKSPACE" --target "$CARGO_TARGET_DIR" \
            --output '${{ steps.destination.outputs.root }}/retained' \
            --artifacts "$GITHUB_WORKSPACE/validation/cas-lock-resolution" \
            --input examples/correction-memory/ci/envelope.py \
            --input examples/correction-memory/ci/resolve_lock.py \
            --input examples/correction-memory/ci/test_envelope.py \
            --input .github/workflows/check-cas-lock-resolution.yml \
            -- python3 -B -I examples/correction-memory/ci/resolve_lock.py
      - name: Retain bounded invocation evidence including failures
        if: always() && steps.destination.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cas-lock-resolution-${{ github.sha }}
          path: ${{ steps.destination.outputs.root }}/retained/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
