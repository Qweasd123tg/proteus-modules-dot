name: Isolated DCP runtime packaging experiment
on:
  push:
    branches: ['ci/dcp-runtime-packaging-20261027']
    paths:
      - 'performance/2026-10-27/dcp-runtime-packaging/**'
      - '.github/workflows/dcp-runtime-packaging.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dcp-runtime-packaging-${{ github.ref }}
  cancel-in-progress: false
jobs:
  packaging:
    if: github.repository == 'Qweasd123tg/proteus-modules-dot' && github.ref == 'refs/heads/ci/dcp-runtime-packaging-20261027'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.15'
      - name: Verify exact bundle and prove clean relocated runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -I performance/2026-10-27/dcp-runtime-packaging/run_hosted.py \
            --work "$RUNNER_TEMP/dcp-packaging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --evidence "$RUNNER_TEMP/dcp-packaging-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Retain bounded proof, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dcp-runtime-packaging-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dcp-packaging-evidence-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 7
