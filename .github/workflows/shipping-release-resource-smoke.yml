name: Private exact four-procedure release resource smoke

on:
  push:
    branches: [ci/shipping-release-smoke-20261028-02]
    paths:
      - '.github/workflows/shipping-release-resource-smoke.yml'
      - 'benchmarks/shipping-smoke-*.py'
      - 'benchmarks/shipping-wrapper-primitives.py'
      - 'benchmarks/shipping-stdio-*.py'
      - 'benchmarks/shipping-smoke-admission/**'

permissions:
  contents: read

concurrency:
  group: shipping-release-resource-smoke-${{ github.ref }}
  cancel-in-progress: false

env:
  ROOT_AUTHORIZATION_SHA256: "c0c5b13b56a460f41df55554dd82781090ec1e36148bea806551450c122fed32"
  LAUNCHER_SHA256: "fd6a7fcadab50e7d00ebc50c5368111b2ed9eff146c6917d11d5cb3ef44bc036"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONOPTIMIZE: "0"

jobs:
  resource-smoke:
    if: github.event_name == 'push' && github.run_attempt == 1 && github.repository == 'Qweasd123tg/proteus-modules-dot' && github.ref == 'refs/heads/ci/shipping-release-smoke-20261028-02'
    runs-on: ubuntu-22.04
    timeout-minutes: 250
    steps:
      - name: Read exact reviewed source publication
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wrapper-source
          persist-credentials: false
          fetch-depth: 1

      - name: Require separate exact shipping authority
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          test "$ROOT_AUTHORIZATION_SHA256" != "UNSEALED"
          test "$(printf %s "$ROOT_AUTHORIZATION_SHA256" | wc -c)" -eq 64
          case "$ROOT_AUTHORIZATION_SHA256" in *[!0-9a-f]*) exit 1;; esac
          source="$GITHUB_WORKSPACE/wrapper-source"
          admission="$source/benchmarks/shipping-smoke-admission"
          echo "$ROOT_AUTHORIZATION_SHA256  $admission/authorization.json" | sha256sum --check
          echo "$LAUNCHER_SHA256  $source/benchmarks/shipping-smoke-launch.py" | sha256sum --check
          test "$(git -C "$source" rev-parse HEAD)" = "$GITHUB_SHA"
          test -f "$admission/bindings.json"
          # Exact GitHub head is independently admitted after publication.
          # No self-referential future commit SHA is embedded in authorization.

      - name: Read immutable qualified publication inputs (setup only)
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Qweasd123tg/proteus-modules-dot
          ref: e3b3dccb608de9c978ba9f7eba69d3a066e5c8a3
          path: qualification-source
          persist-credentials: false
          fetch-depth: 1

      - name: Read separately pinned PR35 source helper (setup only)
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Qweasd123tg/proteus-modules-dot
          ref: 72aeaa37b1f81baf105a0ec09f337237dc0b2a7f
          path: pr35-source
          persist-credentials: false
          fetch-depth: 1

      - name: Provision pinned toolchain and system build prerequisites (not product work)
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          setup_started="$(date -u +%FT%TZ)"
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends build-essential pkg-config clang lld libssl-dev
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          rustup_home="$(realpath "${RUSTUP_HOME:-$HOME/.rustup}")"
          test -d "$rustup_home/toolchains/1.95.0-x86_64-unknown-linux-gnu"
          printf 'RUSTUP_HOME=%s\n' "$rustup_home" >> "$GITHUB_ENV"
          /usr/bin/python3 -I -B -S -c 'import sys; assert sys.version_info[:2] == (3,10)'
          printf 'Infrastructure-only setup start=%s end=%s; no product build/run.\n' "$setup_started" "$(date -u +%FT%TZ)"

      - name: Four resource-only release procedures within original bounded attempt
        id: smoke
        timeout-minutes: 200
        shell: bash
        run: |
          set -euo pipefail
          export SHIPPING_START_MONOTONIC="$(/usr/bin/python3 -I -B -S -c 'import time; print(time.monotonic())')"
          root="$RUNNER_TEMP/proteus-shipping-resource-smoke"
          mkdir -m 700 "$root"
          source="$GITHUB_WORKSPACE/wrapper-source"
          admission="$source/benchmarks/shipping-smoke-admission"
          exec /usr/bin/python3 -I -B -S "$source/benchmarks/shipping-smoke-launch.py" \
            --mode four-resource-smoke \
            --authorization "$admission/authorization.json" \
            --authorization-sha256 "$ROOT_AUTHORIZATION_SHA256" \
            --bindings "$admission/bindings.json" \
            --workflow "$source/.github/workflows/shipping-release-resource-smoke.yml" \
            --work "$root/work" --evidence "$root/evidence" \
            --terminal "$root/terminal-control.jsonl"

      - name: Select one verified package or failure-prefix representative
        id: transport
        if: always()
        timeout-minutes: 1
        shell: bash
        env:
          EXPECT_SUCCESS: ${{ steps.smoke.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -I -B -S - <<'PY'
          import hashlib, json, os, stat
          from pathlib import Path
          expected_success = os.environ["EXPECT_SUCCESS"] == "true"
          root = Path(os.environ["RUNNER_TEMP"])/"proteus-shipping-resource-smoke"
          terminal = root/"terminal-control.jsonl"
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as output:
              output.write("terminal=\narchive=\n")
              if not terminal.exists():
                  assert not expected_success, "successful shipping lacks terminal receipt"
                  raise SystemExit(0)
              info=terminal.lstat()
              assert stat.S_ISREG(info.st_mode) and info.st_size <= 1024**2
              output.write("terminal="+str(terminal)+"\n")
              raw=terminal.read_bytes()
              if not raw.endswith(b"\n"):
                  assert not expected_success, "successful shipping has torn terminal receipt"
                  raise SystemExit(0)
              try:
                  last=json.loads(raw.splitlines()[-1])
              except (ValueError,IndexError):
                  assert not expected_success, "successful shipping has invalid terminal receipt"
                  raise SystemExit(0)
              if last.get("kind") != "terminal":
                  assert not expected_success, "successful shipping has no terminal frame"
                  raise SystemExit(0)
              receipt=last["value"]
              if expected_success:
                  assert receipt["status"] == "SHIPPING_TERMINAL_COMPLETE_AWAITING_JOB_SUCCESS"
                  assert receipt["owned_cleanup_complete"] is True and not receipt["forced_owned_pids"]
              name=receipt.get("archive_path")
              if name is None:
                  assert not expected_success, "successful shipping lacks archive observation"
                  raise SystemExit(0)
              assert name in {str(root/"evidence.tar.gz"),str(root/"evidence.tar.gz.partial")}
              path=Path(name)
              before=path.lstat()
              assert stat.S_ISREG(before.st_mode) and before.st_size <= (256*1024**2-1024**2-65536)
              digest,size=hashlib.sha256(),0
              fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW)
              try:
                  opened=os.fstat(fd)
                  assert (opened.st_dev,opened.st_ino) == (before.st_dev,before.st_ino)
                  while True:
                      chunk=os.read(fd,65536)
                      if not chunk:
                          break
                      size += len(chunk)
                      assert size <= (256*1024**2-1024**2-65536)
                      digest.update(chunk)
                  after=os.fstat(fd)
                  assert (before.st_size,before.st_mtime_ns,before.st_ctime_ns) == \
                         (after.st_size,after.st_mtime_ns,after.st_ctime_ns)
              finally:
                  os.close(fd)
              assert size == before.st_size == receipt["archive"]["bytes"]
              assert digest.hexdigest() == receipt["archive"]["sha256"]
              assert size+len(raw)+65536 <= 256*1024**2
              # Never upload both complete/partial hardlink aliases.
              output.write("archive="+name+"\n")
          PY

      - name: Retain one bounded artifact and terminal sidecar even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shipping-resource-smoke-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.transport.outputs.archive }}
            ${{ steps.transport.outputs.terminal }}
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: External exact-job terminal authority (no performance claim)
        if: always()
        shell: bash
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          TRANSPORT_OUTCOME: ${{ steps.transport.outcome }}
        run: |
          test "$SMOKE_OUTCOME" = "success"
          test "$TRANSPORT_OUTCOME" = "success"
          echo "Exactly four resource feasibility procedures only; no latency statistics or performance claim."
